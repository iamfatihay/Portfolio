<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Fatih Ay</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <!--
    Served by Netlify for any unmatched path. It is plain HTML on purpose: a
    404 that had to boot the React bundle first would be slower than the page
    the visitor was actually looking for.
  -->
  <style>
    :root {
      --title-color: hsl(0, 0%, 20%);
      --text-color: hsl(0, 0%, 46%);
      --body-color: hsl(0, 0%, 98%);
      --first-color: #2c5aa0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
      background: var(--body-color);
      color: var(--text-color);
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      line-height: 1.7;
    }

    main { max-width: 30rem; }

    .code {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--first-color);
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 0.75rem;
      color: var(--title-color);
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      letter-spacing: -0.02em;
    }

    p { margin: 0 0 2rem; }

    a {
      display: inline-block;
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      background: var(--first-color);
      color: #fff;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.25s ease;
    }

    a:hover { background: #1e3a66; }

    a:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.55);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <span class="code">Error 404</span>
    <h1>This page doesn't exist</h1>
    <p>The link may be out of date, or the address slightly off. Everything lives on one page here.</p>
    <a href="/">Back to the portfolio</a>
  </main>
</body>
</html>
